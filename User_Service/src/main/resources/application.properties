spring.application.name=User-Service
spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.username=root
spring.datasource.password=Bnbam@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8083

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.circuitbreaker.instances.courseService.slidingWindowSize=3
resilience4j.circuitbreaker.instances.courseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.courseService.waitDurationInOpenState=3s
resilience4j.circuitbreaker.instances.courseService.permittedNumberOfCallsInHalfOpenState=2
management.endpoints.web.exposure.include=health,info,metrics

resilience4j.retry.instances.courseService.maxAttempts=3
resilience4j.retry.instances.courseService.waitDuration=2s

resilience4j.ratelimiter.instances.courseService.limitForPeriod=2
resilience4j.ratelimiter.instances.courseService.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.courseService.timeoutDuration=0